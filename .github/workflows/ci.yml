name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install QA tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run static QA
        run: bash ./scripts/qa.sh --static

  plasma6-build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install Plasma 6 build dependencies
        run: >-
          pacman -Syu --noconfirm
          git base-devel cmake ninja extra-cmake-modules
          qt6-base qt6-declarative
          kconfig kcoreaddons ki18n kwindowsystem
          libplasma plasma-workspace
      - uses: actions/checkout@v4
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
