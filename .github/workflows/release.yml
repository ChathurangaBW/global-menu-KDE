name: Production Release Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.0.0
  PLUGIN_ID: org.chathuranga.globalmenu

jobs:
  static-release-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install QA tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Verify clean patch formatting
        run: git diff --check HEAD^
      - name: Validate release metadata and repository contract
        run: |
          test "$(jq -r '.KPlugin.Version' src/metadata.json)" = "$VERSION"
          grep -Fq "project(global-menu-kde VERSION $VERSION" CMakeLists.txt
          bash -n packaging/arch/PKGBUILD
          bash ./scripts/qa.sh --static

  sanitizer:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 35
    steps:
      - name: Install build and sanitizer dependencies
        run: >-
          pacman -Syu --noconfirm
          git base-devel clang cmake ninja extra-cmake-modules
          qt6-base qt6-declarative
          kconfig kcoreaddons ki18n kwindowsystem
          libplasma plasma-workspace
      - uses: actions/checkout@v4
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure Clang ASan/UBSan build
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Run sanitizer test suite repeatedly
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          ctest --test-dir build-sanitize --output-on-failure
          --repeat until-fail:5

  debian-package:
    name: Debian 13 ${{ matrix.deb_arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:13
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            deb_arch: arm64
    steps:
      - name: Install Plasma 6 build and smoke-test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git build-essential cmake ninja-build extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev \
            libkf6config-dev libkf6coreaddons-dev libkf6i18n-dev libkf6windowsystem-dev \
            libplasma-dev plasma-workspace-dev plasma-workspace \
            xvfb dbus-daemon dpkg-dev file
      - uses: actions/checkout@v4
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run complete test suite
        run: ctest --test-dir build --output-on-failure
      - name: Flake gate
        run: ctest --test-dir build --output-on-failure --repeat until-fail:5
      - name: Stage and smoke-test staged plugin
        run: |
          DESTDIR="$GITHUB_WORKSPACE/stage" cmake --install build
          plugin=$(find "$GITHUB_WORKSPACE/stage" -type f -name "$PLUGIN_ID.so" -print -quit)
          test -n "$plugin"
          file "$plugin"
          ldd "$plugin" | tee /tmp/staged-ldd.txt
          ! grep -q 'not found' /tmp/staged-ldd.txt
          QT_PLUGIN_PATH="$(dirname "$(dirname "$(dirname "$plugin")")")${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}" \
            bash ./scripts/smoke-plasmawindowed.sh "$PLUGIN_ID"
      - name: Build Debian package
        run: cpack --config build/CPackConfig.cmake -G DEB -B dist
      - name: Inspect and install Debian package
        run: |
          deb=$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.deb_arch }}"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg -i "$deb"
          installed=$(find /usr -type f -name "$PLUGIN_ID.so" -print -quit)
          test -n "$installed"
          ldd "$installed" | tee /tmp/installed-ldd.txt
          ! grep -q 'not found' /tmp/installed-ldd.txt
          bash ./scripts/smoke-plasmawindowed.sh "$PLUGIN_ID"
          mkdir -p release-assets
          cp "$deb" "release-assets/global-menu-kde_${VERSION}_${{ matrix.deb_arch }}.deb"
          sha256sum release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: debian-${{ matrix.deb_arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  fedora-package:
    name: Fedora 44 ${{ matrix.rpm_arch }}
    runs-on: ${{ matrix.runner }}
    container: fedora:44
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            rpm_arch: aarch64
    steps:
      - name: Install Plasma 6 build and smoke-test dependencies
        run: >-
          dnf install -y
          git gcc-c++ cmake ninja-build extra-cmake-modules
          qt6-qtbase-devel qt6-qtdeclarative-devel
          kf6-kconfig-devel kf6-kcoreaddons-devel kf6-ki18n-devel kf6-kwindowsystem-devel
          libplasma-devel plasma-workspace-devel plasma-workspace
          xorg-x11-server-Xvfb dbus-daemon rpm-build file findutils
      - uses: actions/checkout@v4
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Configure release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run complete test suite
        run: ctest --test-dir build --output-on-failure
      - name: Flake gate
        run: ctest --test-dir build --output-on-failure --repeat until-fail:5
      - name: Stage and smoke-test staged plugin
        run: |
          DESTDIR="$GITHUB_WORKSPACE/stage" cmake --install build
          plugin=$(find "$GITHUB_WORKSPACE/stage" -type f -name "$PLUGIN_ID.so" -print -quit)
          test -n "$plugin"
          file "$plugin"
          ldd "$plugin" | tee /tmp/staged-ldd.txt
          ! grep -q 'not found' /tmp/staged-ldd.txt
          QT_PLUGIN_PATH="$(dirname "$(dirname "$(dirname "$plugin")")")${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}" \
            bash ./scripts/smoke-plasmawindowed.sh "$PLUGIN_ID"
      - name: Build RPM package
        run: cpack --config build/CPackConfig.cmake -G RPM -B dist
      - name: Inspect and install RPM package
        run: |
          rpm_file=$(find dist -maxdepth 1 -type f -name '*.rpm' -print -quit)
          test -n "$rpm_file"
          test "$(rpm -qp --qf '%{ARCH}' "$rpm_file")" = "${{ matrix.rpm_arch }}"
          rpm -qip "$rpm_file"
          rpm -qlp "$rpm_file"
          dnf install -y "$rpm_file"
          installed=$(find /usr -type f -name "$PLUGIN_ID.so" -print -quit)
          test -n "$installed"
          ldd "$installed" | tee /tmp/installed-ldd.txt
          ! grep -q 'not found' /tmp/installed-ldd.txt
          bash ./scripts/smoke-plasmawindowed.sh "$PLUGIN_ID"
          mkdir -p release-assets
          cp "$rpm_file" "release-assets/global-menu-kde-${VERSION}-1.${{ matrix.rpm_arch }}.rpm"
          sha256sum release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-${{ matrix.rpm_arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  arch-package:
    name: Arch Linux x86_64
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Install Plasma 6 build and smoke-test dependencies
        run: >-
          pacman -Syu --noconfirm
          git base-devel cmake ninja extra-cmake-modules
          qt6-base qt6-declarative
          kconfig kcoreaddons ki18n kwindowsystem
          libplasma plasma-workspace xorg-server-xvfb file
      - uses: actions/checkout@v4
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run release build and tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          ctest --test-dir build --output-on-failure --repeat until-fail:5
      - name: Stage and smoke-test staged plugin
        run: |
          DESTDIR="$GITHUB_WORKSPACE/stage" cmake --install build
          plugin=$(find "$GITHUB_WORKSPACE/stage" -type f -name "$PLUGIN_ID.so" -print -quit)
          test -n "$plugin"
          ldd "$plugin" | tee /tmp/staged-ldd.txt
          ! grep -q 'not found' /tmp/staged-ldd.txt
          QT_PLUGIN_PATH="$(dirname "$(dirname "$(dirname "$plugin")")")${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}" \
            bash ./scripts/smoke-plasmawindowed.sh "$PLUGIN_ID"
      - name: Build native Arch package as unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --nodeps --cleanbuild --force"
      - name: Inspect, install, and smoke-test Arch package
        run: |
          pkg=$(find packaging/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' -print -quit)
          test -n "$pkg"
          pacman -Qip "$pkg"
          pacman -Qlp "$pkg"
          pacman -U --noconfirm "$pkg"
          installed=$(find /usr -type f -name "$PLUGIN_ID.so" -print -quit)
          test -n "$installed"
          ldd "$installed" | tee /tmp/installed-ldd.txt
          ! grep -q 'not found' /tmp/installed-ldd.txt
          bash ./scripts/smoke-plasmawindowed.sh "$PLUGIN_ID"
          mkdir -p release-assets
          cp "$pkg" "release-assets/global-menu-kde-${VERSION}-1-x86_64.pkg.tar.zst"
          sha256sum release-assets/*
      - uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - static-release-qa
      - sanitizer
      - debian-package
      - fedora-package
      - arch-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-assets
      - name: Assemble release assets and checksums
        run: |
          mkdir -p release-assets
          find downloaded-assets -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp {} release-assets/ \;
          git archive --format=tar.gz --prefix="global-menu-kde-${VERSION}/" \
            -o "release-assets/global-menu-kde-${VERSION}-source.tar.gz" "$GITHUB_SHA"
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 6
          (cd release-assets && sha256sum * | sort -k2 > SHA256SUMS)
          cat release-assets/SHA256SUMS
      - name: Publish production GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite an immutable production release." >&2
            exit 1
          fi
          gh release create "$tag" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Global Menu KDE ${VERSION}" \
            --notes-file .github/RELEASE_NOTES_1.0.0.md
