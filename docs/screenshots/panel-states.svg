<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Global Menu KDE panel behavior</title>
  <desc id="desc">Three Plasma panel states: desktop fallback menu, Dolphin application menu takeover, and desktop fallback restored after Dolphin closes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8edf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" fill="#f8fafc" font-family="Inter, Noto Sans, sans-serif" font-size="34" font-weight="700">Global Menu KDE</text>
  <text x="64" y="108" fill="#9aa7bd" font-family="Inter, Noto Sans, sans-serif" font-size="18">One native Plasma panel · desktop fallback only when no application menu is exported</text>

  <!-- State 1 -->
  <g transform="translate(64 154)" filter="url(#shadow)">
    <rect width="1152" height="138" rx="18" fill="#171b24" stroke="#303846"/>
    <rect x="20" y="22" width="1112" height="42" rx="10" fill="#242a35"/>
    <circle cx="43" cy="43" r="8" fill="#5da9ff"/>
    <g fill="#f3f6fb" font-family="Noto Sans, sans-serif" font-size="17">
      <text x="72" y="49">File</text><text x="123" y="49">Edit</text><text x="172" y="49">View</text>
      <text x="226" y="49">Go</text><text x="266" y="49">Tools</text><text x="322" y="49">Settings</text><text x="396" y="49">Help</text>
    </g>
    <text x="20" y="99" fill="#7dd3fc" font-family="Inter, Noto Sans, sans-serif" font-size="15" font-weight="700">DESKTOP</text>
    <text x="109" y="99" fill="#c7d2e2" font-family="Inter, Noto Sans, sans-serif" font-size="16">No app menu exported → desktop fallback is visible inside the existing panel.</text>
  </g>

  <!-- State 2 -->
  <g transform="translate(64 322)" filter="url(#shadow)">
    <rect width="1152" height="196" rx="18" fill="#171b24" stroke="#303846"/>
    <rect x="20" y="22" width="1112" height="42" rx="10" fill="#242a35"/>
    <circle cx="43" cy="43" r="8" fill="#5da9ff"/>
    <g fill="#f3f6fb" font-family="Noto Sans, sans-serif" font-size="17">
      <text x="72" y="49">File</text><text x="123" y="49">Edit</text><text x="172" y="49">View</text>
      <text x="226" y="49">Go</text><text x="266" y="49">Tools</text><text x="322" y="49">Settings</text><text x="396" y="49">Help</text>
    </g>
    <rect x="20" y="78" width="1112" height="95" rx="10" fill="url(#window)"/>
    <rect x="20" y="78" width="1112" height="30" rx="10" fill="#dde5ef"/>
    <circle cx="42" cy="93" r="5" fill="#60a5fa"/>
    <text x="58" y="99" fill="#1f2937" font-family="Noto Sans, sans-serif" font-size="14" font-weight="700">Dolphin</text>
    <text x="43" y="142" fill="#475569" font-family="Noto Sans, sans-serif" font-size="14">Home</text>
    <text x="101" y="142" fill="#475569" font-family="Noto Sans, sans-serif" font-size="14">Documents</text>
    <text x="192" y="142" fill="#475569" font-family="Noto Sans, sans-serif" font-size="14">Downloads</text>
    <text x="20" y="192" fill="#86efac" font-family="Inter, Noto Sans, sans-serif" font-size="15" font-weight="700">APP ACTIVE</text>
    <text x="126" y="192" fill="#c7d2e2" font-family="Inter, Noto Sans, sans-serif" font-size="16">KDE's normal exported application menu takes over automatically.</text>
  </g>

  <!-- State 3 -->
  <g transform="translate(64 548)" filter="url(#shadow)">
    <rect width="1152" height="108" rx="18" fill="#171b24" stroke="#303846"/>
    <rect x="20" y="20" width="1112" height="42" rx="10" fill="#242a35"/>
    <circle cx="43" cy="41" r="8" fill="#5da9ff"/>
    <g fill="#f3f6fb" font-family="Noto Sans, sans-serif" font-size="17">
      <text x="72" y="47">File</text><text x="123" y="47">Edit</text><text x="172" y="47">View</text>
      <text x="226" y="47">Go</text><text x="266" y="47">Tools</text><text x="322" y="47">Settings</text><text x="396" y="47">Help</text>
    </g>
    <text x="20" y="91" fill="#fbbf24" font-family="Inter, Noto Sans, sans-serif" font-size="15" font-weight="700">APP CLOSED</text>
    <text x="127" y="91" fill="#c7d2e2" font-family="Inter, Noto Sans, sans-serif" font-size="16">Fallback returns; no second panel is created.</text>
  </g>
</svg>
